<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-label="Key results across projects"><title>Key results across projects</title>
<style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.16,1,.3,1) both}
.barx{transform-box:fill-box;transform-origin:0% 50%;animation:growx 1.1s cubic-bezier(.16,1,.3,1) both}
.fade{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.line{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2s .5s cubic-bezier(.16,1,.3,1) forwards}
.dot{animation:pulse 2.4s 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.line{stroke-dashoffset:0}}
</style><rect width="1280" height="150" rx="16" fill="#141A22"/><rect x=".5" y=".5" width="1279" height="149" rx="15.5" fill="none" stroke="#26303C"/><text class="fade" x="40.0" y="78" font-size="46" font-weight="700" letter-spacing="-1" fill="#F2A33A" style="animation-delay:0.10s">31.8M</text><text class="fade" x="40.0" y="106" font-size="14" fill="#8D9AA8" style="animation-delay:0.20s">purchases analysed in one</text><text class="fade" x="40.0" y="125" font-size="14" fill="#8D9AA8" style="animation-delay:0.25s">project</text><line x1="320.0" y1="34" x2="320.0" y2="116" stroke="#26303C"/><text class="fade" x="360.0" y="78" font-size="46" font-weight="700" letter-spacing="-1" fill="#F2A33A" style="animation-delay:0.25s">49.4%</text><text class="fade" x="360.0" y="106" font-size="14" fill="#8D9AA8" style="animation-delay:0.35s">of lost revenue caught, vs</text><text class="fade" x="360.0" y="125" font-size="14" fill="#8D9AA8" style="animation-delay:0.40s">11.0% by the plain model</text><line x1="640.0" y1="34" x2="640.0" y2="116" stroke="#26303C"/><text class="fade" x="680.0" y="78" font-size="46" font-weight="700" letter-spacing="-1" fill="#F2A33A" style="animation-delay:0.40s">0.769</text><text class="fade" x="680.0" y="106" font-size="14" fill="#8D9AA8" style="animation-delay:0.50s">AUC on an unseen later period</text><line x1="960.0" y1="34" x2="960.0" y2="116" stroke="#26303C"/><text class="fade" x="1000.0" y="78" font-size="46" font-weight="700" letter-spacing="-1" fill="#F2A33A" style="animation-delay:0.55s">6</text><text class="fade" x="1000.0" y="106" font-size="14" fill="#8D9AA8" style="animation-delay:0.65s">end-to-end projects with</text><text class="fade" x="1000.0" y="125" font-size="14" fill="#8D9AA8" style="animation-delay:0.70s">honest limits</text></svg>