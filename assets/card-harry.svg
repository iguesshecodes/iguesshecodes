<svg xmlns="http://www.w3.org/2000/svg" width="620" height="290" viewBox="0 0 620 290" role="img" aria-label="Harry Styles Tour Analytics"><title>Harry Styles Tour Analytics</title>
<style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.16,1,.3,1) both}
.barx{transform-box:fill-box;transform-origin:0% 50%;animation:growx 1.1s cubic-bezier(.16,1,.3,1) both}
.fade{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.line{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2s .5s cubic-bezier(.16,1,.3,1) forwards}
.dot{animation:pulse 2.4s 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.line{stroke-dashoffset:0}}
</style><rect width="620" height="290" rx="16" fill="#141A22"/><rect x=".5" y=".5" width="619" height="289" rx="15.5" fill="none" stroke="#26303C"/><text class="m fade" x="28" y="42" font-size="12" letter-spacing="2.4" fill="#8D9AA8">MARKET INTELLIGENCE</text><text class="fade" x="28" y="80" font-size="25" font-weight="700" letter-spacing="-.4" fill="#E6EDF3" style="animation-delay:.1s">Harry Styles Tour Analytics</text><text class="fade" x="28" y="110" font-size="14.5" fill="#8D9AA8" style="animation-delay:0.20s">Arena vs stadium economics, revenue per seat</text><text class="fade" x="28" y="131" font-size="14.5" fill="#8D9AA8" style="animation-delay:0.28s">and pricing power across global markets.</text><text class="fade" x="28" y="218" font-size="40" font-weight="700" letter-spacing="-1" fill="#F2A33A" style="animation-delay:0.40s">10%</text><text class="fade" x="28" y="242" font-size="12.5" fill="#8D9AA8" style="animation-delay:0.50s">price rise</text><text class="fade" x="196" y="218" font-size="40" font-weight="700" letter-spacing="-1" fill="#F2A33A" style="animation-delay:0.55s">~10%</text><text class="fade" x="196" y="242" font-size="12.5" fill="#8D9AA8" style="animation-delay:0.65s">revenue lift</text><rect class="bar" x="396" y="212" width="16" height="38" rx="3" fill="#26303C" style="animation-delay:0.40s"/><rect class="bar" x="420" y="198" width="16" height="52" rx="3" fill="#26303C" style="animation-delay:0.47s"/><rect class="bar" x="444" y="206" width="16" height="44" rx="3" fill="#26303C" style="animation-delay:0.54s"/><rect class="bar" x="468" y="164" width="16" height="86" rx="3" fill="#26303C" style="animation-delay:0.61s"/><rect class="bar" x="492" y="180" width="16" height="70" rx="3" fill="#26303C" style="animation-delay:0.68s"/><rect class="bar" x="516" y="132" width="16" height="118" rx="3" fill="#F2A33A" style="animation-delay:0.75s"/><rect class="bar" x="540" y="154" width="16" height="96" rx="3" fill="#26303C" style="animation-delay:0.82s"/><rect class="bar" x="564" y="186" width="16" height="64" rx="3" fill="#26303C" style="animation-delay:0.89s"/><text class="m" x="28" y="272" font-size="11.5" fill="#8D9AA8" opacity=".75">Python  SQL  Plotly  Excel</text></svg>