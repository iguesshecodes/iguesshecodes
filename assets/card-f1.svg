<svg xmlns="http://www.w3.org/2000/svg" width="620" height="290" viewBox="0 0 620 290" role="img" aria-label="F1 2026 Championship Forecast"><title>F1 2026 Championship Forecast</title>
<style>
text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.16,1,.3,1) both}
.barx{transform-box:fill-box;transform-origin:0% 50%;animation:growx 1.1s cubic-bezier(.16,1,.3,1) both}
.fade{animation:rise .9s cubic-bezier(.16,1,.3,1) both}
.line{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 2s .5s cubic-bezier(.16,1,.3,1) forwards}
.dot{animation:pulse 2.4s 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.line{stroke-dashoffset:0}}
